<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | TrueFolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Cormorant+SC:wght@600&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 38 38'><rect width='38' height='38' fill='%230a0c0b'/><line x1='4' y1='8' x2='34' y2='8' stroke='%23c9a96e' stroke-width='2.4'/><line x1='19' y1='8' x2='19' y2='27' stroke='%23c9a96e' stroke-width='2.4'/><line x1='19' y1='17' x2='29' y2='17' stroke='%23c9a96e' stroke-width='2.4'/></svg>">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Jost', system-ui, sans-serif;
  background: #080808;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}
.bg {
  position: absolute;
  inset: 0;
  background-image: url('https://images.unsplash.com/photo-1488716820095-cbe80883c496?w=1800&q=80&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  filter: brightness(0.08) saturate(0.4);
}
.content { position: relative; z-index: 2; }
.logo-lockup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  text-decoration: none;
  margin-bottom: 5rem;
}
.logo-text {
  font-family: 'Cormorant SC', serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: #ffffff;
  letter-spacing: 0.1em;
}
.error-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(6rem, 20vw, 16rem);
  font-weight: 300;
  color: rgba(201,169,110,0.15);
  line-height: 1;
  margin-bottom: 1rem;
  letter-spacing: -0.04em;
}
.error-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.8rem, 4vw, 3.5rem);
  font-weight: 300;
  font-style: italic;
  color: #ffffff;
  margin-bottom: 1.5rem;
  letter-spacing: -0.01em;
}
.error-sub {
  font-size: 0.88rem;
  font-weight: 200;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.08em;
  margin-bottom: 3rem;
  line-height: 1.8;
}
.btn {
  display: inline-block;
  background: #c9a96e;
  color: #080808;
  border: 1px solid #c9a96e;
  padding: 0.9rem 2.5rem;
  font-family: 'Jost', sans-serif;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-decoration: none;
  transition: all 0.3s;
}
.btn:hover { background: transparent; color: #c9a96e; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="content">
  <a href="/" class="logo-lockup">
    <svg width="28" height="28" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="4" y1="8" x2="34" y2="8" stroke="#c9a96e" stroke-width="2.4"/>
      <line x1="19" y1="8" x2="19" y2="27" stroke="#c9a96e" stroke-width="2.4"/>
      <line x1="19" y1="17" x2="29" y2="17" stroke="#c9a96e" stroke-width="2.4"/>
    </svg>
    <span class="logo-text">TrueFolio</span>
  </a>
  <div class="error-num">404</div>
  <h1 class="error-title">This page doesn't exist.</h1>
  <p class="error-sub">The page you're looking for has moved, or never existed.<br>Let's get you back on track.</p>
  <a href="/" class="btn">Back to TrueFolio</a>
</div>
</body>
</html>
